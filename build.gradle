plugins { id 'java'; id 'org.springframework.boot' version '4.1.1'; id 'io.spring.dependency-management' version '1.1.7' }
group='com.lexvertex'; version='0.1.0-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencyManagement { imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3' } }
dependencies {
  implementation 'org.springframework.cloud:spring-cloud-config-server'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  runtimeOnly 'com.mysql:mysql-connector-j'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.named('jar') { enabled = false }