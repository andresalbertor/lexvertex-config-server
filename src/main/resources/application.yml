server:
  port: 8888

spring:
  application:
    name: config-server
  # JDBC is the primary backend. Switch to native only as an emergency fallback.
  profiles:
    active: ${CONFIG_SERVER_PROFILE:jdbc}

  datasource:
    # Dedicated schema/user — never lex_core / lex_app.
    url: ${DB_CONFIG_URL:jdbc:mysql://localhost:3306/lex_config?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_CONFIG_USER:lex_config_app}
    password: ${DB_CONFIG_PASSWORD}
  cloud:
    config:
      server:
        jdbc:
          default-label: master
          sql: SELECT `KEY`, `VALUE` FROM PROPERTIES WHERE APPLICATION=? AND PROFILE=? AND LABEL=?
        native:
          # Emergency only: drop YAML files here manually if jdbc is unavailable.
          search-locations: ${CONFIG_REPO_PATH:file:../../../config-repo}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.config: INFO
