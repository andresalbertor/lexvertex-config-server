# Fallback native PROFILE=dev (localhost). Espejo de V49 gateway-service/dev.
# Runtime normal: JDBC PROPERTIES, no este archivo.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**,/api/v1/organization/**,/api/v1/sessions/**
            - id: client-service
              uri: lb://CLIENT-SERVICE
              predicates:
                - Path=/api/v1/parties/**,/api/v1/clients/**,/api/v1/consents/**
            - id: case-service
              uri: lb://CASE-SERVICE
              predicates:
                - Path=/api/v1/cases/**
            - id: document-service
              uri: lb://DOCUMENT-SERVICE
              predicates:
                - Path=/api/v1/documents/**
            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/v1/catalogs/**
            - id: reporting-service
              uri: lb://REPORTING-SERVICE
              predicates:
                - Path=/api/v1/reports/**
            - id: audit-service
              uri: lb://AUDIT-SERVICE
              predicates:
                - Path=/api/v1/audit/**
            - id: mx-fwd
              uri: http://localhost:8099
              predicates:
                - Path=/mx/v1/**
            - id: vigilis
              uri: http://localhost:8000
              order: -1
              predicates:
                - Path=/vigilis,/vigilis/**
              filters:
                - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

app:
  sso:
    login-url: http://localhost:8089/login
  cors:
    allowed-origins: http://localhost:8089,http://127.0.0.1:8089,http://localhost:8080,http://127.0.0.1:8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
