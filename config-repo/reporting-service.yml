server:
  port: 8087

spring:
  application:
    name: reporting-service
  datasource:
    url: ${DB_REPORTING_URL:jdbc:mysql://localhost:3306/lex_core?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_REPORTING_USER:lex_reporting_ro}
    password: ${DB_REPORTING_PASSWORD:lex_reporting_dev}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
