server:
  port: 8081

spring:
  application:
    name: identity-service
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lex_core?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  auth:
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  jwt:
    access-ttl: ${JWT_ACCESS_TTL:PT1H}
    key-store-path: ${JWT_KEY_STORE_PATH:data/jwt-keys.properties}
    key-id: ${JWT_KEY_ID:}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key: ${JWT_PRIVATE_KEY:}
    require-external-key: ${JWT_REQUIRE_EXTERNAL_KEY:false}
  client-service:
    base-url: ${CLIENT_SERVICE_URL:http://client-service:8082}
  security:
    hibp:
      enabled: ${HIBP_ENABLED:true}
      fail-open: ${HIBP_FAIL_OPEN:false}

# Cadena propia de identity (emisor JWT). No activar resource-server auto-config.
lexvertex:
  mail:
    from: ${MAIL_FROM:no-reply@lexvertex.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8089}
  openapi:
    enabled: true
    title: Lex Vertex Identity API
    description: Autenticación, MFA, usuarios, roles y sesiones de Lex Vertex.
    version: v1
    contact-name: Lex Vertex
    security-scheme-name: bearerAuth
    bearer-format: JWT
    bearer-description: Token de acceso emitido por /api/v1/auth/mfa/verify
  security:
    enabled: false
    permit-all:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/auth/password/forgot
      - /api/v1/auth/password/reset
      - /api/v1/auth/password/security-challenge
      - /api/v1/auth/password/security-reset
      - /api/v1/auth/invitations/**
      - /api/v1/auth/email/**
      - /api/v1/auth/mfa/totp/setup
      - /api/v1/auth/mfa/verify
      - /api/v1/auth/mfa/email-code
      - /api/v1/auth/mfa/email-code/verify
      - /api/v1/auth/password/recovery-options
      - /.well-known/jwks.json
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/health
      - /actuator/info
      - /internal/client-users

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
