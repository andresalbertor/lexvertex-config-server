server:
  port: 8088

spring:
  application:
    name: audit-service
  datasource:
    url: ${DB_AUDIT_URL:jdbc:mysql://localhost:3306/lex_audit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_AUDIT_USER:lex_audit_app}
    password: ${DB_AUDIT_PASSWORD:lex_audit_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: lex_audit
    default-schema: lex_audit
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:lex}
    password: ${RABBITMQ_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
