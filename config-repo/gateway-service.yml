server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: identity-service
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**,/api/v1/organization/**,/api/v1/sessions/**
            - id: client-service
              uri: lb://CLIENT-SERVICE
              predicates:
                - Path=/api/v1/parties/**,/api/v1/clients/**,/api/v1/consents/**
            - id: case-service
              uri: lb://CASE-SERVICE
              predicates:
                - Path=/api/v1/cases/**
            - id: document-service
              uri: lb://DOCUMENT-SERVICE
              predicates:
                - Path=/api/v1/documents/**
            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/v1/catalogs/**
            - id: reporting-service
              uri: lb://REPORTING-SERVICE
              predicates:
                - Path=/api/v1/reports/**
            - id: audit-service
              uri: lb://AUDIT-SERVICE
              predicates:
                - Path=/api/v1/audit/**
            - id: mx-fwd
              uri: http://mx-fwd:8099
              predicates:
                - Path=/mx/v1/**
            - id: vigilis
              uri: ${VIGILIS_SERVICE_URL:http://vigilis-web:8000}
              order: -1
              predicates:
                - Host=vigilis.lexvertex.cloud

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

app:
  cors:
    allowed-origins: https://www.lexvertex.cloud,https://lexvertex.cloud,https://vigilis.lexvertex.cloud,http://localhost:8089,http://127.0.0.1:8089

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
