# Compartido (PROFILE=default). Las rutas HTTP viven en gateway-service-dev|prod.yml
# (y en PROPERTIES PROFILE=dev|prod) para evitar que Spring sobrescriba índices de lista.
server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
